<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools | CarlVs</title>
    <meta name="description" content="Micro-aplicaciones y herramientas útiles.">
    <meta property="og:title" content="Tools | CarlVs">
    <meta property="og:description" content="Micro-aplicaciones y herramientas útiles.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://carlvs.dev/tools/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tools | CarlVs">
    <meta name="twitter:description" content="Micro-aplicaciones y herramientas útiles.">
    <link rel="canonical" href="https://carlvs.dev/tools/">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: #1a1a1a;
            color: #f8f8f2;
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
        }
        ::selection { background: #f92672; color: #1a1a1a; }
        a { color: #66d9ef; text-decoration: none; transition: color 0.3s ease; }
        a:hover { color: #a6e22e; }
        strong { color: #fd971f; }

        /* ── Navbar ── */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(26,26,26,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid #3a3a3a;
            z-index: 1000;
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-logo {
            font-size: 1.2rem; font-weight: 700;
            display: flex; align-items: center; gap: 0.4rem;
            background: linear-gradient(135deg, #f92672 0%, #ae81ff 50%, #66d9ef 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-logo:hover {
            background: linear-gradient(135deg, #66d9ef 0%, #ae81ff 50%, #f92672 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-links { display: flex; gap: 1.5rem; }
        .nav-links a {
            color: #75715e; font-size: 0.85rem; transition: color 0.3s ease; position: relative;
        }
        .nav-links a:hover { color: #f8f8f2; }
        .nav-links a.active { color: #66d9ef; }
        .nav-links a.active::after {
            content: ''; position: absolute; bottom: -4px;
            left: 0; right: 0; height: 2px; background: #66d9ef;
        }
        .nav-right { display: flex; align-items: center; gap: 1rem; }
        .nav-toggle { display: none; background: none; border: none; color: #f8f8f2; font-size: 1.3rem; cursor: pointer; }

        @media (max-width: 768px) {
            .nav-links {
                display: none; position: absolute; top: 60px; left: 0; right: 0;
                background: rgba(26,26,26,0.95); backdrop-filter: blur(12px);
                flex-direction: column; padding: 1rem 2rem; gap: 1rem;
            }
            .nav-links.open { display: flex; }
            .nav-toggle { display: block; }
        }
        @media (max-width: 480px) {
            .nav-logo { font-size: 0.9rem; gap: 0.25rem; }
        }

        /* ── Hero ── */
        .tools-hero {
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 6rem 2rem 3rem;
        }
        .tools-hero h1 {
            font-size: 2.5rem;
            color: #a6e22e;
            margin-bottom: 1rem;
        }
        .tools-hero p {
            color: #75715e;
            font-size: 1rem;
            max-width: 500px;
        }

        /* ── Tools grid ── */
        .tools-section {
            padding: 0 2rem 5rem;
            max-width: 900px;
            margin: 0 auto;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.2rem;
        }
        .tool-card {
            background: #222;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .tool-card:hover {
            border-color: #66d9ef;
            transform: translateY(-3px);
            box-shadow: 0 4px 20px rgba(102, 217, 239, 0.1);
        }
        .tool-card .icon {
            font-size: 1.8rem;
            color: #66d9ef;
            margin-bottom: 0.8rem;
        }
        .tool-card h3 {
            font-size: 1rem;
            color: #f8f8f2;
            margin-bottom: 0.4rem;
        }
        .tool-card p {
            font-size: 0.8rem;
            color: #75715e;
            line-height: 1.6;
            flex: 1;
        }
        .tool-card .coming-soon {
            font-size: 0.75rem;
            color: #f92672;
            margin-top: 0.75rem;
        }
        .tool-card .status-badge {
            display: inline-block;
            background: #3a3a3a;
            color: #75715e;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-top: 0.75rem;
            align-self: flex-start;
        }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #75715e;
        }
        .empty-state i { font-size: 3rem; margin-bottom: 1rem; display: block; color: #3a3a3a; }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid #3a3a3a;
        }
        .footer p { color: #75715e; font-size: 0.8rem; }
        .footer a { color: #66d9ef; }

        /* ── Light theme ── */
        html.light body { background: #fafafa; color: #2d2d2d; }
        html.light ::selection { background: #f92672; color: #fff; }
        html.light .navbar { background: rgba(250,250,250,0.85); border-bottom-color: #ddd; }
        html.light .nav-links a { color: #999; }
        html.light .nav-links a:hover { color: #2d2d2d; }
        html.light .nav-links a.active { color: #f92672; }
        html.light .nav-links a.active::after { background: #f92672; }
        html.light .tool-card { background: #f5f5f5; border-color: #ddd; }
        html.light .tool-card h3 { color: #2d2d2d; }
        html.light .tool-card:hover { border-color: #f92672; }
        html.light .tool-card .icon { color: #f92672; }
        html.light .tools-hero h1 { color: #f92672; }
        html.light .footer { border-top-color: #ddd; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="nav-logo"><svg width="22" height="22" viewBox="0 0 32 32"><defs><linearGradient id="navLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f92672"/><stop offset="50%" stop-color="#ae81ff"/><stop offset="100%" stop-color="#66d9ef"/></linearGradient></defs><text x="16" y="22" font-family="monospace" font-size="14" font-weight="bold" fill="url(#navLogoGrad)" text-anchor="middle">CVs</text></svg>Carlos Villén Villar</a>
        <div class="nav-links" id="navLinks">
            <a href="/">Inicio</a>
            <a href="/tools/" class="active">Tools</a>
        </div>
        <div class="nav-right">
            <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
        </div>
    </nav>

    <!-- Hero -->
    <section class="tools-hero">
        <h1><span data-i18n="title">Tools</span></h1>
        <p><span data-i18n="subtitle">Micro-aplicaciones y utilidades</span></p>
    </section>

    <!-- Tools Grid -->
    <section class="tools-section">
        <div class="tools-grid" id="toolsGrid">
            <!-- Placeholder for future tools -->
        </div>
        <div class="empty-state">
            <i class="fas fa-flask"></i>
            <p data-i18n="empty">Próximamente — nuevas herramientas en camino</p>
        </div>
    </section>

    <!-- Footer -->
    <div class="footer">
        <p>© 2026 Carlos Villén Villar · <a href="/">carlvs.dev</a></p>
    </div>

    <!-- Theme restoration -->
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light');
        }
        /* Navbar mobile toggle */
        document.getElementById('navToggle').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('open');
        });
    </script>
</body>
</html>
