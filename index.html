<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarlVs | Developer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            color: #f8f8f2;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(166, 226, 46, 0.08);
            animation: float 25s linear infinite;
            border-radius: 50%;
        }

        .bg-animation span:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; animation-duration: 20s; background: rgba(249, 38, 114, 0.08); }
        .bg-animation span:nth-child(2) { left: 20%; width: 40px; height: 40px; animation-delay: 2s; animation-duration: 25s; }
        .bg-animation span:nth-child(3) { left: 35%; width: 60px; height: 60px; animation-delay: 4s; animation-duration: 18s; background: rgba(102, 217, 239, 0.08); }
        .bg-animation span:nth-child(4) { left: 50%; width: 90px; height: 90px; animation-delay: 0s; animation-duration: 22s; }
        .bg-animation span:nth-child(5) { left: 65%; width: 30px; height: 30px; animation-delay: 3s; animation-duration: 30s; background: rgba(253, 151, 31, 0.08); }
        .bg-animation span:nth-child(6) { left: 75%; width: 70px; height: 70px; animation-delay: 5s; animation-duration: 15s; }
        .bg-animation span:nth-child(7) { left: 85%; width: 50px; height: 50px; animation-delay: 7s; animation-duration: 20s; background: rgba(174, 129, 255, 0.08); }
        .bg-animation span:nth-child(8) { left: 45%; width: 45px; height: 45px; animation-delay: 1s; animation-duration: 28s; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .lang-switcher {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.5rem;
            z-index: 100;
        }

        .lang-btn {
            padding: 0.5rem 1rem;
            border: 1px solid #3a3a3a;
            background: rgba(26, 26, 26, 0.9);
            color: #75715e;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .lang-btn:hover {
            border-color: #66d9ef;
            color: #66d9ef;
        }

        .lang-btn.active {
            background: #66d9ef;
            color: #1a1a1a;
            border-color: #66d9ef;
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            max-width: 800px;
        }

        .greeting {
            font-size: 1.2rem;
            color: #a6e22e;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }

        .name {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #f92672 0%, #ae81ff 50%, #66d9ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.2s forwards;
        }

        .title {
            font-size: 1.8rem;
            color: #75715e;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.4s forwards;
        }

        .title span {
            color: #66d9ef;
            border-right: 2px solid #66d9ef;
            padding-right: 5px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 50% { border-color: #66d9ef; }
            51%, 100% { border-color: transparent; }
        }

        .description {
            font-size: 1.1rem;
            color: #a6a68a;
            line-height: 1.8;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.6s forwards;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.8s forwards;
        }

        .btn {
            padding: 0.9rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a6e22e 0%, #66d9ef 100%);
            color: #1a1a1a;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(166, 226, 46, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #66d9ef;
            border: 2px solid #66d9ef;
        }

        .btn-secondary:hover {
            background: #66d9ef;
            color: #1a1a1a;
            transform: translateY(-3px);
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            opacity: 0;
            animation: fadeInUp 0.8s ease 1s forwards;
        }

        .social-links a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #75715e;
            font-size: 1.3rem;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background: #f92672;
            color: #1a1a1a;
            transform: translateY(-5px);
            border-color: #f92672;
        }

        .scroll-indicator {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            opacity: 0;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .scroll-indicator.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .scroll-indicator a {
            color: #75715e;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
            padding: 1rem 2rem;
            background: rgba(26, 26, 26, 0.9);
            border-radius: 30px;
            border: 1px solid #3a3a3a;
            backdrop-filter: blur(10px);
        }

        .scroll-indicator a:hover {
            color: #a6e22e;
            border-color: #a6e22e;
            background: rgba(166, 226, 46, 0.1);
        }

        .scroll-indicator i {
            animation: bounce 2s infinite;
            font-size: 1.2rem;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats {
            display: flex;
            gap: 3rem;
            justify-content: center;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.7s forwards;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #f92672;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #75715e;
        }

        @media (max-width: 768px) {
            .name {
                font-size: 2.5rem;
            }

            .title {
                font-size: 1.3rem;
            }

            .stats {
                gap: 1.5rem;
            }

            .stat-number {
                font-size: 1.8rem;
            }

            .social-links a {
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }

            .scroll-indicator {
                bottom: 1rem;
            }

            .scroll-indicator span {
                display: none;
            }

            .lang-switcher {
                top: 1rem;
                right: 1rem;
            }

            .lang-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-animation">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="es">ES</button>
        <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <div class="container">
        <div class="hero">
            <p class="greeting" data-i18n="greeting">¡Hola! Soy</p>
            <h1 class="name">CarlVs</h1>
            <h2 class="title"><span data-i18n="title">Ingeniero de Software</span> <span>|</span></h2>
            <p class="description" data-i18n="description">
                Apasionado por construir soluciones robustas y escalables.
                <br>Especializado en Backend, SRE y automatización de procesos.
            </p>

            <div class="stats">
                <div class="stat">
                    <div class="stat-number">5+</div>
                    <div class="stat-label" data-i18n="exp">Años de experiencia</div>
                </div>
                <div class="stat">
                    <div class="stat-number">10+</div>
                    <div class="stat-label" data-i18n="projects">Proyectos completados</div>
                </div>
                <div class="stat">
                    <div class="stat-number">∞</div>
                    <div class="stat-label" data-i18n="coffee">Tazas de café</div>
                </div>
            </div>

            <div class="cta-buttons">
                <a href="/about/" class="btn btn-primary">
                    <i class="fas fa-user"></i> <span data-i18n="about">Sobre mí</span>
                </a>
                <a href="#projects" class="btn btn-secondary">
                    <i class="fas fa-code"></i> <span data-i18n="view_projects">Ver proyectos</span>
                </a>
                <a href="mailto:cvillenv@gmail.com" class="btn btn-secondary">
                    <i class="fas fa-envelope"></i> <span data-i18n="contact">Contactar</span>
                </a>
            </div>

            <div class="social-links">
                <a href="https://github.com/carlvs" target="_blank" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://linkedin.com/in/carlosvillenvillar/en" target="_blank" title="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <a href="mailto:cvillenv@gmail.com" title="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </div>
    </div>

    <div class="scroll-indicator">
        <a href="/about/">
            <span data-i18n="discover">Descubre más</span>
            <i class="fas fa-chevron-down"></i>
        </a>
    </div>

    <script>
        const translations = {
            es: {
                greeting: '¡Hola! Soy',
                title: 'Ingeniero de Software',
                description: 'Apasionado por construir soluciones robustas y escalables.<br>Especializado en Backend, SRE y automatización de procesos.',
                exp: 'Años de experiencia',
                projects: 'Proyectos completados',
                coffee: 'Tazas de café',
                about: 'Sobre mí',
                view_projects: 'Ver proyectos',
                contact: 'Contactar',
                discover: 'Descubre más'
            },
            en: {
                greeting: "Hi! I'm",
                title: 'Software Engineer',
                description: 'Passionate about building robust and scalable solutions.<br>Specialized in Backend, SRE, and process automation.',
                exp: 'Years of experience',
                projects: 'Completed projects',
                coffee: 'Cups of coffee',
                about: 'About me',
                view_projects: 'View projects',
                contact: 'Contact',
                discover: 'Discover more'
            }
        };

        function setLanguage(lang) {
            document.documentElement.lang = lang;
            localStorage.setItem('lang', lang);
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });

        const savedLang = localStorage.getItem('lang') || 'es';
        setLanguage(savedLang);

        const scrollIndicator = document.querySelector('.scroll-indicator');

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 100) {
                scrollIndicator.classList.add('visible');
            } else {
                scrollIndicator.classList.remove('visible');
            }
        });

        document.querySelector('.scroll-indicator a').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = '/about/';
        });
    </script>
</body>

</html>
