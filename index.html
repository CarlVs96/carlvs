<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarlVs | Developer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .bg-animation span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: rgba(56, 189, 248, 0.1);
            animation: float 25s linear infinite;
            border-radius: 50%;
        }

        .bg-animation span:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; animation-duration: 20s; }
        .bg-animation span:nth-child(2) { left: 20%; width: 40px; height: 40px; animation-delay: 2s; animation-duration: 25s; }
        .bg-animation span:nth-child(3) { left: 35%; width: 60px; height: 60px; animation-delay: 4s; animation-duration: 18s; }
        .bg-animation span:nth-child(4) { left: 50%; width: 90px; height: 90px; animation-delay: 0s; animation-duration: 22s; }
        .bg-animation span:nth-child(5) { left: 65%; width: 30px; height: 30px; animation-delay: 3s; animation-duration: 30s; }
        .bg-animation span:nth-child(6) { left: 75%; width: 70px; height: 70px; animation-delay: 5s; animation-duration: 15s; }
        .bg-animation span:nth-child(7) { left: 85%; width: 50px; height: 50px; animation-delay: 7s; animation-duration: 20s; }
        .bg-animation span:nth-child(8) { left: 45%; width: 45px; height: 45px; animation-delay: 1s; animation-duration: 28s; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            max-width: 800px;
        }

        .greeting {
            font-size: 1.2rem;
            color: #38bdf8;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }

        .name {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.2s forwards;
        }

        .title {
            font-size: 1.8rem;
            color: #94a3b8;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.4s forwards;
        }

        .title span {
            color: #38bdf8;
            border-right: 2px solid #38bdf8;
            padding-right: 5px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 50% { border-color: #38bdf8; }
            51%, 100% { border-color: transparent; }
        }

        .description {
            font-size: 1.1rem;
            color: #64748b;
            line-height: 1.8;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.6s forwards;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.8s forwards;
        }

        .btn {
            padding: 0.9rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            color: #0f172a;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.3);
        }

        .btn-secondary {
            background: transparent;
            color: #38bdf8;
            border: 2px solid #38bdf8;
        }

        .btn-secondary:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-3px);
        }

        .social-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            opacity: 0;
            animation: fadeInUp 0.8s ease 1s forwards;
        }

        .social-links a {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #1e293b;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 1.3rem;
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-5px);
            border-color: #38bdf8;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            animation: fadeInUp 0.8s ease 1.2s forwards;
        }

        .scroll-indicator a {
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s ease;
        }

        .scroll-indicator a:hover {
            color: #38bdf8;
        }

        .scroll-indicator i {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats {
            display: flex;
            gap: 3rem;
            justify-content: center;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 0.8s ease 0.7s forwards;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #38bdf8;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #64748b;
        }

        @media (max-width: 768px) {
            .name {
                font-size: 2.5rem;
            }

            .title {
                font-size: 1.3rem;
            }

            .stats {
                gap: 1.5rem;
            }

            .stat-number {
                font-size: 1.8rem;
            }

            .social-links a {
                width: 45px;
                height: 45px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <div class="bg-animation">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="container">
        <div class="hero">
            <p class="greeting">¡Hola! Soy</p>
            <h1 class="name">CarlVs</h1>
            <h2 class="title">Ingeniero de Software <span>|</span></h2>
            <p class="description">
                Apasionado por construir soluciones robustas y escalables.
                <br>Especializado en Backend, SRE y automatización de procesos.
            </p>

            <div class="stats">
                <div class="stat">
                    <div class="stat-number">5+</div>
                    <div class="stat-label">Años de experiencia</div>
                </div>
                <div class="stat">
                    <div class="stat-number">10+</div>
                    <div class="stat-label">Proyectos completados</div>
                </div>
                <div class="stat">
                    <div class="stat-number">∞</div>
                    <div class="stat-label">Tazas de café</div>
                </div>
            </div>

            <div class="cta-buttons">
                <a href="/about/" class="btn btn-primary">
                    <i class="fas fa-user"></i> Sobre mí
                </a>
                <a href="#projects" class="btn btn-secondary">
                    <i class="fas fa-code"></i> Ver proyectos
                </a>
                <a href="mailto:cvillenv@gmail.com" class="btn btn-secondary">
                    <i class="fas fa-envelope"></i> Contactar
                </a>
            </div>

            <div class="social-links">
                <a href="https://github.com/carlvs" target="_blank" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://linkedin.com/in/carlosvillenvillar/en" target="_blank" title="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
                <a href="mailto:cvillenv@gmail.com" title="Email">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </div>

        <div class="scroll-indicator">
            <a href="/about/">
                <span>Descubre más</span>
                <i class="fas fa-chevron-down"></i>
            </a>
        </div>
    </div>
</body>

</html>
